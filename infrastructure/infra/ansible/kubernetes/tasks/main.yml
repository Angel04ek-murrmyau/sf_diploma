---
# tasks file for kubernetes
- name: Disable swap
  command: swapoff -a

- name: Remove swap from fstab
  lineinfile:
    path: '/etc/fstab'
    regexp: '\sswap\s'
    state: 'absent'

- name: Load kernel modules for K8s
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Let bridge traffic pass through iptables
  sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables

- name: Install dependences
  apt:
    update_cache: yes
    name:
      - ca-certificates
      - curl
      - gnupg
      - apt-transport-https
      - lsb-release
    state: present

- name: Add docker repo key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
    
- name: Add docker to sources.list.d
  apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu jammy stable
    state: present

- name: Install containerd
  apt:
    name: containerd.io 
    state: present
    update_cache: yes

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

- name: Write containerd config
  copy:
    dest: /etc/containerd/config.toml
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
        SystemdCgroup = true

- name: Launch containerd
  systemd:
    name: containerd 
    enabled: yes
    state: restarted

- name: Add kubernetes repo key
  apt_key:
    url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
    state: present

- name: Add kubernetes to sources.list.d
  apt_repository:
    repo: deb https://pkgs.k8s.io/core:/stable:/v1.30/deb/ / 
    state: present

- name: Install kubernetes
  apt:
    update_cache: yes
    name:
      - kubelet
      - kubeadm
      - kubectl      
    state: present

- name: Launch kubernetes
  systemd:
    name: kubelet
    enabled: yes
    state: restarted
  
- name: Install node exporter
  apt:
    update_cache: yes
    name: prometheus-node-exporter
    state: present

- name: Download helm binary script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0755"

- name: Run helm install script
  command: /tmp/get_helm.sh
  args:
    creates: /usr/local/bin/helm

- name: Check if kubernetes is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kube_config
  run_once: true
  delegate_to: master

- name: Wait for kubeadm init
  pause:
    prompt: "Если Вы запускаете плейбук в первый раз, то выполните kubeadm init и kubeadm join по инструкции в документации, и нажмите Enter. Если Вы запускаете плейбук не впервые, то пропустите этот шаг, и нажмите Enter"
  run_once: true

- name: Add grafana repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "https://grafana.github.io/helm-charts"
  when: kube_config.stat.exists
  run_once: true
  delegate_to: master

- name: Install promtail
  kubernetes.core.helm:
    name: promtail
    chart_ref: grafana/promtail
    release_namespace: monitoring
    create_namespace: true
    kubeconfig: /etc/kubernetes/admin.conf
    values:
      config:
        clients: 
          - url: "http://{{ hostvars['srv']['internal_ip'] }}:3100/loki/api/v1/push" 
      daemonset:
        enabled: true  
    wait: yes
  when: kube_config.stat.exists
  run_once: true
  delegate_to: master